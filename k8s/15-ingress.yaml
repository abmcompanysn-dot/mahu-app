# Frontend (web) has moved to Cloudflare Workers (opennextjs-cloudflare) -
# this ingress now only routes the Go backend API. Caddy on this host
# terminates ai-api.mahu.cards and forwards here (see diarra-vps Caddyfile).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mahu
  namespace: mahu
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: ai-api.mahu.cards
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { number: 4000 } } }
