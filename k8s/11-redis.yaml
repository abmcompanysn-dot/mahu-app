apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: mahu
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mahu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: mahu-datastore-creds, key: REDIS_PASSWORD } }
          command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mahu
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
