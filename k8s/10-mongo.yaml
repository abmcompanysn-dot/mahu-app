apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: mahu
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: mahu
spec:
  replicas: 1
  strategy:
    type: Recreate # single ReadWriteOnce volume - never run two mongo pods at once
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports: [{ containerPort: 27017 }]
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom: { secretKeyRef: { name: mahu-datastore-creds, key: MONGO_ROOT_USER } }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mahu-datastore-creds, key: MONGO_ROOT_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /data/db }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: mongo-data }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: mahu
spec:
  selector: { app: mongo }
  ports: [{ port: 27017, targetPort: 27017 }]
