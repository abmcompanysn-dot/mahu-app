# Image mahu-web:latest - same local build+import as backend, see 13-backend.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: mahu
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: mahu-web:latest
          imagePullPolicy: Never
          ports: [{ containerPort: 3000 }]
          env:
            - { name: BACKEND_URL, value: "http://backend:4000" }
          envFrom:
            - secretRef: { name: mahu-web-env }
          readinessProbe:
            tcpSocket: { port: 3000 }
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: mahu
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
