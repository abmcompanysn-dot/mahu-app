services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - mahu_internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    networks:
      - mahu_internal

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4001"]
    ports:
      - "127.0.0.1:4001:4001"
      - "100.79.191.101:4001:4001"
    networks:
      - mahu_internal

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      - mongo
      - redis
      - litellm
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      - mahu_internal

  web:
    build: .
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - mahu_internal

networks:
  mahu_internal:
    driver: bridge

volumes:
  mongo_data:
  redis_data:
